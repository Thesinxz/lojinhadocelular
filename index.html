    <!-- Prevent blank white screens on asset 404 after redeploys -->
    <script>
      window.addEventListener('error', function (e) {
        try {
          var msg = (e && e.message) || '';
          var isChunkError =
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1;
          if (isChunkError) {
            var lastReload = null;
            try {
              lastReload = window.sessionStorage ? window.sessionStorage.getItem('chunk_reload') : null;
            } catch (err) {}
            var now = Date.now();
            if (!lastReload || now - parseInt(lastReload, 10) > 10000) {
              try {
                if (window.sessionStorage) {
                  window.sessionStorage.setItem('chunk_reload', String(now));
                }
              } catch (err) {}
              window.location.reload();
            }
          }
        } catch (globalErr) {}
      });
    </script>
